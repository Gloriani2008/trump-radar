name: Trump Radar Cron
on:
  schedule:
    - cron: '*/5 * * * *' # 每5分钟运行一次
  workflow_dispatch:      # 允许你在 GitHub 页面手动点“运行”测试

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        run: python api/cron.py
        env:
          MY_BARK_KEY: ${{ secrets.MY_BARK_KEY }}
