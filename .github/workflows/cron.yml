name: Trump Radar Cron
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        env:
          MY_BARK_KEY: ${{ secrets.MY_BARK_KEY }}
        run: python api/cron.py
